plugins {
    id 'com.android.application'
}

android {
    namespace = "cn.xfangfang.wiliwili"
    compileSdkVersion 33
    defaultConfig {
        applicationId "cn.xfangfang.wiliwili"
        // Android TV requires API 21+
        minSdkVersion 21
        targetSdkVersion 33
        versionCode 1
        versionName "1.5.3"
        ndkVersion "29.0.14206865"
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_PLATFORM=android-21", "-DANDROID_STL=c++_shared", "-DCMAKE_WARN_DEPRECATED=FALSE"
                abiFilters 'armeabi-v7a', 'arm64-v8a'
                version = '3.16.0+'
            }
        }
    }
    signingConfigs {
        release {
            storeFile file("wiliwili.jks")
            storePassword project.findProperty('WILIWILI_STORE_PASSWORD') ?: 'password'
            keyAlias project.findProperty('WILIWILI_KEY_ALIAS') ?: 'wiliwili'
            keyPassword project.findProperty('WILIWILI_KEY_PASSWORD') ?: 'password'
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    applicationVariants.all { variant ->
        tasks["merge${variant.name.capitalize()}Assets"]
            .dependsOn("externalNativeBuild${variant.name.capitalize()}")
    }
    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        sourceSets.main {
            jniLibs.srcDir 'libs'
        }
        externalNativeBuild {
            cmake {
                path 'jni/CMakeLists.txt'
                version = '3.16.0+'
            }
        }
    }
    lint {
        abortOnError = false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.leanback:leanback:1.0.0'
}
